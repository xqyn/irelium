[build-system]
requires = ['setuptools>68']
build-backend = 'setuptools.build_meta'

[project]
name = 'irelium'
version = '0.1.0'
description = 'irelium'
requires-python = '>=3.11'

[tool.setuptools.packages.find]
where = ["."]
include = ["irelium*"]

[project.optional-dependencies]
docs-sphinx = [
    "sphinx>=7.0",
    "myst-parser>=3.0",
    "sphinx-autoapi>=3.0",
    #"furo>=2024.0",
    "pydata-sphinx-theme>=0.15",
    "sphinx-copybutton",
]
docs-mkdocs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]
docs = ["irelium[docs-sphinx,docs-mkdocs]"]