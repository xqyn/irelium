[build-system]
requires = ['setuptools>68']
build-backend = 'setuptools.build_meta'

[project]
name = 'irelium'
version = '0.1.0'
description = 'irelium'
requires-python = '>=3.11'

[tool.setuptools.packages.find]
where = ['.']


[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-jupyter>=0.24",
]